name: CD

# Déclenchement :
#   - push sur la branche principale (image tagguée `latest` + SHA)
#   - tag de version sémantique vX.Y.Z (image tagguée avec la version)
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Pas d'annulation en cours : on ne veut pas interrompre une livraison active.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── 1. Build & push de l'image API sur GHCR ─────────────────────────────────
  build-push:
    name: Build & push de l'image API (GHCR)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Mise en place de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcul des tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image cible sur ghcr.io — metadata-action la met en minuscules
          images: ghcr.io/${{ github.repository }}/mlproject-api
          tags: |
            # `latest` uniquement sur la branche par défaut (main)
            type=raw,value=latest,enable={{is_default_branch}}
            # SHA court du commit (ex: sha-a1b2c3d) — traçabilité fine
            type=sha,prefix=sha-
            # Tags sémantiques sur les tags vX.Y.Z (ex: 1.2.3 et 1.2)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache GitHub Actions — évite de reconstruire les couches inchangées
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Déploiement sur Oracle Cloud (main uniquement) ────────────────────────
  # Pré-requis — secrets GitHub à configurer :
  #   ORACLE_HOST     : IP publique du VPS (ex: 140.x.x.x)
  #   ORACLE_USER     : utilisateur SSH (généralement "ubuntu" sur Oracle Linux/Ubuntu)
  #   ORACLE_SSH_KEY  : contenu de la clé privée SSH (le fichier .pem complet)
  #
  # Pré-requis sur le VPS (une seule fois, manuel) :
  #   git clone https://github.com/<owner>/<repo>.git ~/td_orchestrationML_EthanVIEVILLE
  deploy:
    name: Déploiement sur Oracle Cloud
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH → git pull + redémarrage de la stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/td_orchestrationML_EthanVIEVILLE

            echo "=== [1/3] Récupération du code ==="
            git pull origin main

            echo "=== [2/3] Redémarrage de la stack ==="
            TRAIN_MODE=baseline docker compose --profile airflow up --build -d

            echo "=== [3/3] État des conteneurs ==="
            docker compose --profile airflow ps

            echo "[OK] Déploiement terminé — $(date)"
