name: ibm-hr-attrition

# Pipeline MLOps complète — de l'entraînement à la prédiction.
#
# Flux d'exécution :
#   trainer → (produit model.joblib) → api → (sert les prédictions)
#                                       └──────────────────────────► streamlit (dashboard)
#
# Lancement :
#   docker compose up --build          # pipeline standard  (baseline ~30s)
#   make compose-up                    # idem, via Makefile
#   make compose-full                  # GridSearchCV 5 modèles
#   make compose-optuna                # Optuna LightGBM 20 trials
#   docker compose --profile monitoring up --build   # + MLflow UI sur :5000
#
# Ports exposés :
#   :8000 → API FastAPI  (docs : http://localhost:8000/docs)
#   :8501 → Dashboard Streamlit
#   :5000 → MLflow UI (profil monitoring uniquement)
#
# Volumes partagés :
#   model_vol  : model.joblib écrit par trainer, lu par api (lecture seule)
#   mlruns_vol : base SQLite MLflow + artefacts (partagé trainer / streamlit)

services:

  # ── Entraînement ─────────────────────────────────────────────────────────────
  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    volumes:
      - model_vol:/app/models          # écrit model.joblib ici
      - mlruns_vol:/app/mlruns         # tracking MLflow persistant
      - ./data:/app/data               # données réelles si disponibles, sinon synthétiques
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlruns/mlruns.db
      MLFLOW_EXPERIMENT: ibm-hr-attrition
      MODEL_NAME: attrition-classifier
      DEPLOY_STAGE: champion
      GIT_PYTHON_REFRESH: quiet
      # TRAIN_MODE contrôle le script d'entraînement (voir docker/train-entrypoint.sh) :
      #   baseline → LogisticRegression ~30s   (make compose-up)
      #   full     → GridSearchCV 5 modèles    (make compose-full)
      #   optuna   → Optuna LightGBM 20 trials (make compose-optuna)
      TRAIN_MODE: ${TRAIN_MODE:-baseline}
    restart: "no"   # le service s'arrête après l'entraînement (exit 0 = succès)

  # ── API d'inférence ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - model_vol:/app/models:ro       # lecture seule — ne modifie pas le modèle
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlruns/mlruns.db
      MODEL_NAME: attrition-classifier
    depends_on:
      trainer:
        condition: service_completed_successfully   # attend que l'entraînement réussisse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Dashboard Streamlit ──────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      - mlruns_vol:/app/mlruns:ro        # accès lecture aux runs MLflow
      - ./data:/app/data:ro              # dataset IBM HR pour l'onglet Exploration
    environment:
      API_URL: http://api:8000
      AIRFLOW_URL: http://airflow:8080
      MLFLOW_TRACKING_URI: sqlite:////app/mlruns/mlruns.db
      MLFLOW_EXPERIMENT: ibm-hr-attrition
    depends_on:
      api:
        condition: service_healthy       # attend que l'API soit prête
    restart: unless-stopped

  # ── Airflow (optionnel) ───────────────────────────────────────────────────────
  # Lancé uniquement avec : docker compose --profile airflow up
  # UI sur http://localhost:8080 — login : airflow / airflow
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags                               # DAGs découverts automatiquement
      - ./mlproject:/opt/airflow/project/mlproject             # package Python du projet
      - ./tests:/opt/airflow/project/tests                     # generate_synthetic_data.py
      - ./data:/opt/airflow/project/data                       # dataset (writable pour prepare_data)
      - model_vol:/opt/airflow/project/models                  # modèles partagés avec api
      - mlruns_vol:/opt/airflow/project/mlruns                 # MLflow runs partagés
      - airflow_logs:/opt/airflow/logs                         # logs persistants entre redémarrages
    environment:
      # ── Airflow core ───────────────────────────────────────────────────────
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor              # mono-processus, adapté au dev local
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db  # home airflow, déjà writable
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"                    # pas de DAGs exemples
      AIRFLOW__WEBSERVER__SECRET_KEY: "ibm-hr-attrition-mlops-secret-2024"
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8080"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"          # scan dags/ toutes les 30s
      # ── Projet ML ─────────────────────────────────────────────────────────
      PYTHONPATH: /opt/airflow/project                         # active les imports mlproject.*
      MLFLOW_TRACKING_URI: sqlite:////opt/airflow/project/mlruns/mlruns.db
      MLFLOW_EXPERIMENT: ibm-hr-attrition
      MODEL_NAME: attrition-classifier
      DEPLOY_STAGE: champion
      GIT_PYTHON_REFRESH: quiet
      # ── DAG predictions ───────────────────────────────────────────────────
      API_URL: http://api:8000                                  # joignable si api tourne aussi
      N_PREDICTIONS: "20"
      QUALITY_THRESHOLD: "0.35"
    profiles:
      - airflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  # ── MLflow UI (optionnel) ─────────────────────────────────────────────────────
  # Lancé uniquement avec : docker compose --profile monitoring up
  mlflow-ui:
    image: python:3.13-slim
    ports:
      - "5000:5000"
    volumes:
      - mlruns_vol:/app/mlruns
      - ./docker/mlflow_serve.py:/mlflow_serve.py:ro
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlruns/mlruns.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /app/mlruns/artifacts
    command:
      - /bin/sh
      - -c
      - "pip install -q --no-cache-dir mlflow gunicorn && gunicorn --bind 0.0.0.0:5000 --workers 1 --chdir / mlflow_serve:app"
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  model_vol:    # modèle entraîné partagé entre trainer et api
  mlruns_vol:   # données MLflow (runs, métriques, artefacts)
  airflow_logs: # logs Airflow persistants entre redémarrages
